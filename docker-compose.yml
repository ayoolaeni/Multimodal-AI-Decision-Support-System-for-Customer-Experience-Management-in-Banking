services:
  app:
    build: .
    ports:
      # Host port defaults to 8502 (8501 is often taken by other Streamlit
      # apps). Override with e.g. APP_PORT=8600 if 8502 is also taken.
      - "${APP_PORT:-8502}:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
    restart: unless-stopped
